# .dogfood.toml: where things are in Forgeboard, for the DOGFOOD acceptance checker.
# Run:  docker compose up   then   python3 run.py .dogfood.toml

[portal]
base_url = "http://localhost:3000"

[tiers]
claimed = ["T1", "T2", "T3", "T4"]
pitch = "From first commit to final verdict: a self-hostable submission and judging portal with backend-enforced judge isolation and documented cross-judge normalization."

[auth]
# Fixed demo sessions, created when the fixtures are imported at boot (docker-compose.yml).
# The portal prints them at startup. Never run demo mode on an instance with real data.
organizer   = "Cookie: forgeboard_session=org_demo_7f2a9c41d8e3b6a5"
judge_a     = "Cookie: forgeboard_session=jdg_a_demo_91bc5e0f27d4a8c3"
judge_b     = "Cookie: forgeboard_session=jdg_b_demo_44de83a1c9f06b72"
participant = "Cookie: forgeboard_session=prt_demo_2e88b7d14c6f3a19"

[routes]
gallery      = "/events/sample-hack-2026/gallery"
submit       = "/api/events/sample-hack-2026/projects"
judge_scores = "/api/judge/scores"
# judge_a is jdg_24 (the most reviews); judge_b is jdg_29, who shares no project with them.
peer_scores  = "/api/judge/scores?judge=jdg_24"
csv_export   = "/api/events/sample-hack-2026/export/reviews"
