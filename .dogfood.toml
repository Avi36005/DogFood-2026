# .dogfood.toml: where things are in Forgeboard, for the DOGFOOD acceptance checker.
# Run:  docker compose up   then   python3 run.py .dogfood.toml

[portal]
base_url = "http://localhost:8080"

[tiers]
# All four tiers are built. run.py has checks for T1 and T2 only, so its report verifies those and
# ends with its standard note for the rest: "claimed but not verified: T3 T4". T3 and T4 are
# verified by our own checkers, in the same format, against the same docker compose up (CI reruns
# all three on every push; run them in this order on a fresh volume):
#   python3 run.py .dogfood.toml                > acceptance-report.txt      (7 checks, T1 T2)
#   python3 scripts/t3_check.py .dogfood.toml   > acceptance-report-t3.txt   (15 checks, T3)
#   python3 scripts/t4_check.py .dogfood.toml   > acceptance-report-t4.txt   (12 checks, T4)
claimed = ["T1", "T2", "T3", "T4"]
pitch = "A self-hosted hackathon portal with zero runtime dependencies, backend-enforced judge isolation, a judge-bias correction proven on the fixture data, and signed results that verify themselves offline."

[auth]
# Fixed demo sessions, created only when FORGEBOARD_DEMO=1 (docker-compose.yml sets it).
# The portal prints them at boot. Never enable demo mode on an instance with real data.
organizer   = "Cookie: session=org_demo_7f2a9c41d8e3b6a5"
judge_a     = "Cookie: session=jdg_a_demo_91bc5e0f27d4a8c3"
judge_b     = "Cookie: session=jdg_b_demo_44de83a1c9f06b72"
participant = "Cookie: session=prt_demo_2e88b7d14c6f3a19"

[routes]
gallery      = "/projects"
submit       = "/projects/new"
judge_scores = "/api/judge/scores"
# judge_a is jdg_24 (Diego Herrera, 11 reviews); judge_b is jdg_29, who shares no project with them.
peer_scores  = "/api/judge/scores?judge=jdg_24"
csv_export   = "/api/export.csv"
