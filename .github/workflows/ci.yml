# Every push re-proves the claims in the README: types, our tests, the organizers' own checker
# against a fresh `docker compose up` (byte for byte against the committed report), and the
# network-off rule.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up (fresh volume, seeded with the fixtures)
        run: docker compose up -d --build
      - name: wait for the portal
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          docker compose logs
          exit 1
      - name: the organizers' checker, compared with the committed report
        run: |
          python3 run.py .dogfood.toml > report.txt
          cat report.txt
          diff -u acceptance-report.txt report.txt
      - name: our T3 checks, compared with the committed report
        run: |
          python3 scripts/t3_check.py .dogfood.toml > t3.txt
          cat t3.txt
          diff -u acceptance-report-t3.txt t3.txt
      - name: signed results verify offline after publishing
        run: |
          # A JSON body needs no form token (a cross-site page cannot send one without a preflight).
          curl -fsS -H 'Cookie: session=org_demo_7f2a9c41d8e3b6a5' -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d '{}' http://localhost:8080/organize/sample-hack-2026/results/publish
          curl -fsS http://localhost:8080/events/sample-hack-2026/results.json > results.json
          curl -fsS -H 'Cookie: session=org_demo_7f2a9c41d8e3b6a5' http://localhost:8080/organize/sample-hack-2026/results/capsule.html > capsule.html
          docker compose exec -T forgeboard node --disable-warning=ExperimentalWarning src/cli.ts verify-audit
          docker compose cp capsule.html forgeboard:/tmp/capsule.html
          docker compose exec -T forgeboard node --disable-warning=ExperimentalWarning src/cli.ts verify-results /tmp/capsule.html
      - run: docker compose down -v
      - name: network off
        run: sh scripts/offline-check.sh
