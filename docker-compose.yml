# One command to a running, seeded portal:
#
#     docker compose up
#
# There is no database service because the database is a file on the volume
# below. Nothing here reaches the network at runtime.
services:
  forgeboard:
    build: .
    image: forgeboard:local
    container_name: forgeboard
    ports:
      - "3000:3000"
    environment:
      # Set to 0 to start with an empty instance instead of the demo event.
      FORGEBOARD_SEED: "1"
      # The container terminates TLS nowhere, so cookies are not Secure-only.
      FORGEBOARD_INSECURE_COOKIES: "1"
    volumes:
      - forgeboard-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  forgeboard-data:
